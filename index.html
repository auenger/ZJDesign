<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181a19" />
    <script>
      try {
        const preference = localStorage.getItem('zhuojiang-theme') || 'auto';
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <meta name="description" content="琢匠，属于你的金属小人装配工坊。自由组合头部、身体、四肢与装备，360° 欣赏你的作品。" />
    <title>琢匠 · 小人装配工坊</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
